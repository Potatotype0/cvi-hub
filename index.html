<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ALI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Readex+Pro:wght@300;400;600;700&family=Saira:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Design A · Ruins & Ember: midnight navy, one bonfire glow, cold silver text */
  :root {
    --bg:#060a14; --card:#0b1226; --cardbg:linear-gradient(180deg,#0e1834 0%,#0a1125 100%);
    --line:#18233f; --line2:#2a3a63; --ink:#e6eaf4; --mute:#8794b3;
    --accent:#E0301E; --accent2:#ff7a4d; --glow:0 0 26px rgba(224,48,30,.22);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; color:var(--ink); font-family:"Readex Pro", system-ui, sans-serif; font-weight:300; line-height:1.7; position:relative; overflow-x:hidden;
    background:
      radial-gradient(ellipse 80% 45% at 50% 108%, rgba(224,48,30,.26), transparent 62%),
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(40,70,140,.35), transparent 70%),
      linear-gradient(#060a14, #0a1124 70%, #090d1c);
    background-attachment:fixed; }
  body::before { content:""; position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.6) 100%); }
  body::after { content:""; position:fixed; left:0; right:0; top:0; height:14px; background:#000; z-index:8; box-shadow:0 calc(100vh - 14px) 0 #000; pointer-events:none; }
  .sn { font-family:"Saira", "Readex Pro", sans-serif; font-weight:700; }
  .page { position:relative; z-index:2; }

  /* fog and embers */
  .fx { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .fx::before, .fx::after { content:""; position:absolute; left:-30%; width:160%; height:42%; filter:blur(40px); opacity:.55;
    background:radial-gradient(ellipse at 30% 50%, rgba(120,150,210,.16), transparent 60%), radial-gradient(ellipse at 75% 50%, rgba(90,120,190,.12), transparent 62%);
    animation:fog 38s ease-in-out infinite alternate; }
  .fx::before { top:48%; }
  .fx::after { top:12%; animation-duration:52s; animation-direction:alternate-reverse; opacity:.35; }
  @keyframes fog { from { transform:translateX(-6%); } to { transform:translateX(6%); } }
  .ember { position:absolute; bottom:-12px; border-radius:50%; background:#ffb48a; box-shadow:0 0 8px 2px rgba(255,110,60,.7); opacity:0; animation:rise linear infinite; }
  @keyframes rise { 0% { transform:translate(0,0); opacity:0; } 10% { opacity:.9; } 70% { opacity:.5; } 100% { transform:translate(30px,-92vh); opacity:0; } }

  /* layout */
  .wrap { max-width:1080px; margin:0 auto; padding:0 24px; }
  .top { display:flex; align-items:center; gap:10px; padding:22px 0 18px; }
  .mark { font-family:"Cinzel", serif; font-weight:700; letter-spacing:.2em; font-size:15px; }
  .grow { flex:1; }
  .ghost { font:inherit; font-size:13px; font-weight:400; color:var(--ink); background:transparent; border:1px solid var(--line2); padding:5px 14px; cursor:pointer; }
  .ghost:hover { border-color:var(--accent); color:var(--accent2); }
  .hero { padding:34px 0 8px; text-align:center; }
  .hero h1 { margin:0; font-size:clamp(34px, 8vw, 66px); line-height:1.15; font-weight:700; text-shadow:0 0 38px rgba(224,48,30,.38); }
  html[lang="en"] .hero h1 { font-family:"Cinzel", serif; letter-spacing:.1em; }

  .count b { color:var(--ink); font-size:22px; margin-inline-end:6px; }

  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px; }

  .search::placeholder { color:var(--mute); }
  .search:focus { outline:1px solid var(--accent); }

  .chip { font:inherit; font-size:14px; font-weight:400; padding:6px 14px; background:transparent; border:1px solid var(--line); color:var(--mute); cursor:pointer; }
  .chip:hover { color:var(--ink); border-color:var(--line2); }

  section.group { margin-top:34px; }

  section.group h2::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line2), transparent); }
  html[dir="rtl"] section.group h2::after { background:linear-gradient(270deg, var(--line2), transparent); }
  section.group h2 span { color:var(--mute); font-weight:400; order:3; }

  .card { position:relative; background:var(--cardbg); border:1px solid var(--line); padding:20px 20px 18px; display:flex; flex-direction:column; gap:10px; transition:border-color .25s, box-shadow .25s, transform .25s; }

  .card::before { top:-1px; inset-inline-start:-1px; border-width:1px 0 0 1px; }
  html[dir="rtl"] .card::before { border-width:1px 1px 0 0; }
  .card::after { bottom:-1px; inset-inline-end:-1px; border-width:0 1px 1px 0; }
  html[dir="rtl"] .card::after { border-width:0 0 1px 1px; }
  .card:hover::before, .card:hover::after { border-color:var(--accent); }
  .card h3 { margin:0; font-size:19px; font-weight:600; line-height:1.4; }
  .card p { margin:0; color:var(--mute); font-size:15px; }
  .meta { display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:12px; }
  .st { display:inline-flex; align-items:center; gap:7px; font-weight:600; }
  .st::before { content:""; width:9px; height:9px; border-radius:50%; border:1px solid var(--mute); }
  .st.live::before { background:var(--accent); border-color:var(--accent); box-shadow:0 0 10px var(--accent), 0 0 3px var(--accent2); }
  .st.building { color:var(--mute); }
  .tg { color:var(--mute); }
  .links { display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:6px; }
  .links a { font-size:14px; font-weight:600; text-decoration:none; padding:6px 16px; color:var(--ink); border:1px solid var(--line2); }
  .links a:first-child { background:var(--accent); border-color:var(--accent); color:#fff; }
  .links a:hover { filter:brightness(1.15); }
  .empty { color:var(--mute); padding:40px 0; text-align:center; }
  .shelf { text-align:center; padding:6px 0 40px; }
  .shelf h2 { font-family:"Cinzel", "Readex Pro", serif; font-size:13px; font-weight:600; letter-spacing:.18em; color:var(--mute); margin:0 0 14px; }
  .shelf .row { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .shelf .row span { font-size:15px; padding:6px 18px; border:1px solid var(--line2); }
  footer { text-align:center; color:var(--mute); font-size:12px; padding:0 0 60px; }
  @media (max-width:560px) { .wrap { padding:0 16px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } .ember { display:none; } }
</style>
</head>
<body>
